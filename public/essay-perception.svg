<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="A profile whose only feature is an eye reads a coffee-stained certificate and passes a structured record through a slot in a wall to deterministic machinery on the far side">
  <rect width="640" height="400" fill="#efe9dd"/>
  <rect x="18" y="18" width="604" height="364" fill="none" stroke="#2a2030" stroke-width="1.5" opacity="0.5"/>

  <!-- left: the world's input — a tilted certificate with a coffee ring -->
  <g transform="rotate(-8 108 218)">
    <rect x="52" y="140" width="112" height="156" rx="4" fill="#ffffff" stroke="#2a2030" stroke-width="2.6" stroke-linejoin="round"/>
    <line x1="70" y1="166" x2="128" y2="166" stroke="#2a2030" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <g stroke="#9a8aa6" stroke-width="2.4" stroke-linecap="round" opacity="0.8">
      <line x1="70" y1="192" x2="146" y2="192"/>
      <line x1="70" y1="212" x2="146" y2="212"/>
      <line x1="70" y1="232" x2="118" y2="232"/>
    </g>
    <circle cx="152" cy="262" r="21" fill="none" stroke="#cdbfd6" stroke-width="4.5" opacity="0.95"/>
  </g>

  <!-- the sight line: the model looking at the document -->
  <g stroke="#6b5b7a" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M178 200 C 206 194, 222 190, 240 188" stroke-dasharray="2 11"/>
  </g>

  <!-- the mind that only reads: a profile with an eye and nothing else -->
  <g stroke="#2a2030" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round">
    <path d="M348 118 C 300 112, 266 138, 260 172 C 257 186, 246 190, 246 198
             C 246 206, 258 208, 262 214 C 266 232, 268 244, 284 252
             C 300 259, 318 262, 348 264 Z" fill="#f7f3ea"/>
    <path d="M268 176 Q 288 158 308 176 Q 288 194 268 176 Z" fill="#ffffff" stroke-width="2.6"/>
    <circle cx="288" cy="176" r="6.5" fill="#2a2030" stroke="none"/>
    <circle cx="290.5" cy="173.5" r="1.9" fill="#efe9dd" stroke="none"/>
  </g>

  <!-- structured output on the wire, through the slot, and no further claim -->
  <text x="374" y="174" font-family="monospace" font-size="26" fill="#2a2030" letter-spacing="3">{&#160;}</text>
  <g stroke="#6b5b7a" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M356 196 C 400 196, 430 196, 496 196" stroke-dasharray="2 11"/>
    <path d="M490 196 l 14 0 l -7 -7 m 7 7 l -7 7"/>
  </g>

  <!-- the wall: one slot, and the model does not cross it -->
  <g fill="#cdbfd6" stroke="#2a2030" stroke-width="2.6" stroke-linejoin="round">
    <rect x="470" y="18" width="14" height="152" rx="3"/>
    <rect x="470" y="222" width="14" height="160" rx="3"/>
  </g>

  <!-- right of the wall: deterministic code — a gear, and decisions that replay -->
  <g transform="translate(556 128)" stroke="#2a2030" stroke-width="2.6" stroke-linejoin="round">
    <g fill="#f7f3ea">
      <rect x="-7" y="-50" width="14" height="16" transform="rotate(0)"/>
      <rect x="-7" y="-50" width="14" height="16" transform="rotate(45)"/>
      <rect x="-7" y="-50" width="14" height="16" transform="rotate(90)"/>
      <rect x="-7" y="-50" width="14" height="16" transform="rotate(135)"/>
      <rect x="-7" y="-50" width="14" height="16" transform="rotate(180)"/>
      <rect x="-7" y="-50" width="14" height="16" transform="rotate(225)"/>
      <rect x="-7" y="-50" width="14" height="16" transform="rotate(270)"/>
      <rect x="-7" y="-50" width="14" height="16" transform="rotate(315)"/>
    </g>
    <circle cx="0" cy="0" r="36" fill="#f7f3ea"/>
    <circle cx="0" cy="0" r="12" fill="#cdbfd6"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#2a2030" stroke-width="3.2">
      <path d="M506 242 l 8 9 l 16 -20"/>
      <path d="M506 282 l 8 9 l 16 -20"/>
      <path d="M506 322 l 8 9 l 16 -20"/>
    </g>
    <g stroke="#9a8aa6" stroke-width="2.4" opacity="0.85">
      <line x1="540" y1="244" x2="602" y2="244"/>
      <line x1="540" y1="284" x2="602" y2="284"/>
      <line x1="540" y1="324" x2="586" y2="324"/>
    </g>
  </g>
</svg>
